  description: "This panel explores the India AI Stack across five interdependent layers—Applications, Foundation Models, Chips, Hardware, and Energy—examining how key sectors such as defence, research and education, and geospatial services generate value within India's unique constraints of scale, diversity, sovereignty, security, and power availability. Anchored in the vision of the India AI Impact Summit 2026 and the IndiaAI Mission, the discussion bridges policy intent with practical, nation-scale AI implementation for People, Planet, and Progress."
