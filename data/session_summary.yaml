- name: "Fintech for All: Democratizing Financial Access Through AI and Human Capital Development"
  description: "This session explores how AI infrastructure drives equitable growth across fintech ecosystems in India and the Global South. Panelists examine how scalable platforms enable multilingual interfaces and risk models serving diverse populations. The discussion covers GPU-accelerated computing powering real-time fraud detection and personalized banking for underserved communities. Examples demonstrate how democratizing compute access and workforce skilling create economic opportunities and financial inclusion, operationalizing the People and Progress Sutras through the Inclusion for Social Empowerment Chakra."
  speakers:
    - "Anjani Rathor, HDFC"
    - "Kamya Chandra (Moderator), CDPI"
    - "Lipika Kapoor, NABU Sciences"
    - "Sohoni Rajola, Growth NPCI International"
    - "Yogesh Agarwal, Nvidia"
  tags:
    - Finance
- name: "Empowering AI Startups: Democratizing Compute for Economic Growth\n"
  description: "This session explores how accessible high-performance infrastructure accelerates startups in India and emerging markets via scaled infrastructure, compute credits and frameworks, fostering self-reliant AI innovation, which then accelerates venture capital into all stages of startup ecosystems. GPU analytics and low-latency inference enable integration with digital infrastructure such as UPI and ONDC. This operationalizes the People and Progress Sutras through the Democratizing AI Resources Chakra. "
  speakers:
    - "Arun Kumar, Celesta Capital"
    - "Tobias Halloran, Nvidia"
  tags:
    - Hardware
    - Startups
- name: "Advancing LLM Training At Extreme Scale"
  description: "As large language models (LLMs) push toward trillion-parameter frontiers, training at extreme scale demands unprecedented compute efficiency, resilience, and orchestration across thousands of GPUs. This NVIDIA session reveals how the NeMo Framework - leveraging Megatron-Core for tensor, pipeline, sequence, expert parallelism, FP8 precision, and multi-data center support - enables 96% scaling efficiency on 3,072+ H100/H200 GPUs, as demonstrated in Nemotron-4 340B training across distant sites. NVIDIA's Blackwell platform and GB200 NVL72 systems supercharge this with 30x faster real-time inference, disaggregated serving via Dynamo for prefill/decode optimization, and resilient features like auto-failover on DGX Cloud for <1% downtime at 10K-GPU scales. Attendees will gain actionable insights into post-training scaling laws, synthetic data generation, reinforcement learning, and JAX-based horizontal scaling to 10,000+ GPUs, powering next-gen AI from GTC 2025/2026 innovations. "
  speakers:
    - "Bernard Nguyen, Nvidia"
  tags:
    - Hardware
- name: "From Opportunity to Impact: Sharing the Israeli Model of AI Innovation and Governance"
  description: "This event will showcase Israel's national AI model — prioritizing innovation, research, and agile governance over restrictive regulation—to drive social, economic, and public-service transformation. It highlights Israel's strengths (innovation hub, elite technical talent, collaborative public-private partnerships). The session features short talks on national strategy, AI in agriculture, personalized education, future of work, and industry leadership, aiming to share best practices and forge international partnerships."
  speakers:
    - "Brigadier General (Res.) Erez Naftali Askal, Israel Artificial Intelligence Directorate"
    - "Dr. Victor Alchanatis, DSc., Volcani Institute, Ministry of Agriculture"
    - "Dr. Victor Israel Gosalker, Horizon Line Division"
