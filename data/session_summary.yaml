- name: "Building Trust in the Age of Synthetic Media"
  description: "The rapid rise of generative AI and synthetic media has heightened risks to trust, attribution, and accountability online. This session explores how content provenance standards can address these challenges. It will outline the synthetic media landscape, and how provenance clarifies content creation and modification."
