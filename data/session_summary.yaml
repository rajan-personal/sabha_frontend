- name: "AI/ML-Driven Virtual Immersive Personalized Training"
  description: "This session will explore the potential of AI/ML-driven virtual immersive, autonomous, personalized learning solutions to scale talent development in India, particularly for rural, remote and underserved youth in sectors like AI, semiconductors, manufacturing, and telecom to reflect on the Summit's core chakras of Human Capital; Inclusion for Social Empowerment; Safe and Trusted AI; Resilience, Innovation and Efficiency; Science; Democratizing AI Resources; and AI for Economic Development and Social Good."
