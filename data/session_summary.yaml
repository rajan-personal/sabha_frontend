- name: "Safeguarding Children in India's AI Future: Towards Child-Centric AI Policy and Governance"
  description: "As India advances ambitious national AI strategies and positions itself as a global AI leader, the governance choices made today will have long-term \nconsequences for children's rights, safety, dignity and development. Children are not merely 'users' \nof AI systems; they are deeply embedded within algorithmic ecosystems that mediate opportunities \nand risks."
