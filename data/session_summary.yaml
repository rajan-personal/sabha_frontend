- name: "Scaling Enterprise Transformation - How India Can Leapfrog in the AI Economy"
  description: "This session brings together leading disruptors, VCs, and AI practitioners who have leveraged AI to drive transformation across organizations of varying scale and industries. Drawing on real-world experience, the session cuts through hype to reveal what it truly takes to win in the AI era—and pitfalls stalling enterprise transformations. Key topics include decoupling revenue from costs while accelerating growth; building AI-native, innovation-led organizations; and moving beyond pilots to diffuse AI enterprise-wide for lasting impact."
  speakers:
