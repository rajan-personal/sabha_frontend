- name: "The AI Infrastructure Story: Data Centres and Cloud in Action"
  description: "This session explores India’s evolving AI infrastructure stack, from sovereign, secure hyperscale data centres to sustainable cooling, green energy integration, cloud-delivered AI services, and edge computing. It will examine how resilient, energy-efficient, and distributed compute architectures can support India’s AI ambitions while balancing scale, sustainability, security, and accessibility across sectors and geographies."
  speakers:
    - "Sh. Srivenkata Laxminarasimharao Gulimi, Director, STPI-HQ "
    - "Sh. Piyush Somani, Promoter, MD & Chairman, ESDS"
  tags:
    - Hardware
- name: "Teacher-Led, Localised and Frugal AI for Equitable Education in the Commonwealth"
  description: "This session operationalizes the Gaborone Statement by presenting practical pathways for \"Teacher-in-the-Loop\" AI and localized, open-source LLM deployments. Commonwealth ministers and leaders will examine policy, capacity, and governance to enable frugal, sovereign, and inclusive AI in education, specifically for lower-resource settings. Key outcomes include adopting the \"Gaborone → Delhi Compact,\" identifying pilot collaborations, publishing a sovereign education-AI reference architecture, and establishing monitorable indicators for 12-month follow-up. "
  speakers:
