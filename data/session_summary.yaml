- name: "Charting India's AI–IP Playbook: Innovation, Rights and National Advantage"
  description: "From AI-generated content and code to foundation models, traditional boundaries of authorship, inventorship, and ownership are increasingly contested as jurisdictions adapt their intellectual property regimes. The IndiaAI Mission positions indigenous datasets, models, and compute infrastructure as strategic national assets for innovation, exports, and long-term economic growth. Without a future-ready AI–IP framework, India risks legal uncertainty that could constrain innovation and investment. This session situates AI–IP policy within the vision of Viksit Bharat, linking science and innovation, safe and trusted AI, and AI-led economic growth and social good."
  speakers:
    - "Anne E. Robinson, IBM"
    - "Dr. Shardul S. Shroff, Shardul Amarchand Mangaldas & Co"
  tags:
    - Legal
- name: "AI for the SDGs"
  description: "As the 2030 deadline for the Sustainable Development Goals approaches amid economic, social, and geopolitical pressures, this session reframes global development as a structural transformation already underway. Artificial intelligence is reshaping growth models, public institutions, and human capital beyond the SDGs, raising questions about financing, governance, and delivery. Bringing together leaders from finance, philanthropy, technology, and government, the discussion explores how AI can boost productivity, strengthen capacity, unlock development pathways, and mitigate inequality globally equitably."
