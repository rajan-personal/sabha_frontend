    - "Mr. AR Ganesh, Jio Financial Services Ltd"
    - "Mr. Arun Jain, Intellect Design Arena Ltd."
    - "Smt. Neeta Shah, HSBC India"
    - "Smt. Sandhya Arun, Wipro Ltd"
  tags:
