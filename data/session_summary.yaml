  description: "Big challenges. Shared realities. Stronger solutions.\nAcross health, agriculture, and education, the Global South is already building AI that works in real conditions and at real scale. This fireside conversation examines what happens when Global South leaders collaborate, and how partnerships can turn AI potential into tangible development outcomes. Join the conversation on building AI solutions together at the India AI Impact Summit 2026."
