- name: "Shaping the AI Narrative: Trust, Outcomes and Responsibility"
  description: "A candid leadership dialogue with global practitioners shaping the future of enterprise AI. This session goes beyond vision to examine how organizations are turning AI promise into proof: anchored in trust, real‑world impact, and responsible scale. Expect grounded perspectives from leaders building innovative, outcome‑driven AI systems and redefining what effective AI leadership looks like in the next wave of adoption."
  speakers:
