- name: "India-Japan AI for the World"
  description: "In the digital field, Japan and India have identified opportunities for cooperation and strengthened engagement. This session will bring together AI companies from both countries for a panel discussion. Participants will gain insights into AI development approaches in Japan and India, as well as potential areas for collaboration in AI development.\n"
