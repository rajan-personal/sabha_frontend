- name: "High-level discussion on APAC Centre for AI"
  description: "This high level Panel Discussion convening at the India AI Impact Summit 2026 will discuss the proposed Asia Pacific Centre for Artificial Intelligence.\n\nThe session features a short panel discussion followed by an open audience dialogue to gather practical inputs on cross border collaboration, market expansion, adoption pathways, and governance priorities that can enable innovation while strengthening trust and accountability across the region."
  speakers:
    - "Mr. Kamesh Shekar, The Dialogue"
  tags:
    - Governance
- name: "The Future of Work for the Global South: Skilling for Opportunity and Social Mobility"
  description: "This high-level panel explores how AI-driven workforce transformation can unlock economic opportunities and social mobility across the Global South. Convening policymakers, industry leaders, and practitioners, the session examines critical skills gaps, regional priorities, and actionable frameworks for inclusive AI upskilling. Drawing on India's policy leadership and cross-country insights, participants will engage in dialogue to shape future-proof roadmaps that ensure equitable access to AI skills, empowering vulnerable populations and strengthening workforce readiness across emerging economies."
