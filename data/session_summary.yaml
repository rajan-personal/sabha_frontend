- name: "Building Sovereign Deep Tech for a Resilient Future"
  description: "This panel discussion explores pioneering deep tech solutions emerging from innovators. Through examples presented by industry leaders, the panelists discuss how AI integrated solutions can enhance competitiveness, security, and societal resilience. The discussion further explores how research and innovative public-private partnerships can strengthen strategic autonomy and create globally competitive AI ecosystems."
