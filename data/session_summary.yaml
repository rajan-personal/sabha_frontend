- name: "Empowering Youth in AI Global Governance"
  description: "This event gathers international students active in AI global governance to contribute insights to the AI Impact Summit. Participants will meet in person on February 18th for a collaborative working session. This platform enables students to voice their expectations and shape the future of AI governance together."
