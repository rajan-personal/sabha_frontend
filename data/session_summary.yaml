  description: "The session will explore how India's DPI-led approach can enable inclusive AI adoption, unlock job creation, accelerate economic growth, and foster cross-sector collaboration. By bridging policy intent with on-ground execution, the dialogue aims to identify key enablers—policy frameworks, industry participation, and startup innovation—required to scale AI responsibly and equitably across sectors."
