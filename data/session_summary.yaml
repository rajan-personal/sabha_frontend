- name: "Universities as Clty-Scale AI Catalysts: Delhi's Path from Research to Public Impact"
  description: "90-minute programme opens with a 10-minute institutional framing by NSUT and STPI on Delhi’s AI ecosystem and universities’ convening role. A 15-minute keynote by Prof. Anand Srivastava links academic leadership to responsible city-scale AI, curriculum, research, and industry engagement. A 40-minute panel explores translating research to deployment, talent, incubation, inclusivity, and scaling pilots with academic, STPI, government, industry, and policy experts. A 15-minute NSUT - STPI showcase presents 2–3 initiatives. Closing 10-minute reflections outline collaboration pathways ahead.\n"
