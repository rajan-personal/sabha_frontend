- name: "Investing in Bharat: Regional AI Hubs and Inclusive Growth"
  description: "This session examines how AI is transforming education, industry, and institutions at scale. It will explore borderless learning enabled by AI, industry perspectives on adoption and competitiveness, and the integration of AI with blockchain to rewire institutional systems. The discussion will focus on translating policy intent into practical, secure, and scalable implementations across sectors and ecosystems.\n"
  speakers:
    - "Sh. Arvind Kumar, Director General, STPI"
