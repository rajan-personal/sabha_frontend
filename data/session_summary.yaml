  description: "To recognize and encourage exemplary technology startups nurtured within the STPI ecosystem, Software Technology Parks of India (STPI) will felicitate select startups during the AI Impact Summit.\n\nThe felicitation for FY 2024-25 aims to acknowledge startups driving innovation through artificial intelligence led and advanced digital technologies, delivering scalable solutions and measurable business outcomes including revenue growth, alongside employment generation. It will also serve as a national platform to highlight India’s emerging startup success stories, including those from Tier-II and Tier-III regions, and their contribution to the country’s innovation-driven digital economy and the evolving IT and ITeS landscape."
