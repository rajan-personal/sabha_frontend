  description: "As AI reshapes teaching, assessment, and governance, higher education faces a\nshared challenge: preparing faculty for ethical, inclusive, and human-centered\nengagement. Following pre-summit workshops conducted in Canada, Australia,\nand India, the Faculty Futures 2035 panel convenes partners at the India AI Impact\nSummit 2026 to synthesize insights, surface cross-context lessons, and present a\nforward-looking roadmap to guide institutional strategy for the decade ahead."
