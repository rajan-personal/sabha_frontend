- name: "Unlocking Impact: a Shared Data Platform for AI Innovation in Development Cooperation"
  description: "This workshop will introduce a data and AI platform for cooperation and discuss its vision and early applications. It will examine how governments, implementing agencies, and innovators can collaborate to use AI in combination with data and contextual insights. Participants will explore the need for interoperable and trusted infrastructure to support AI agents, and consider how such systems can strengthen the effectiveness of development-related initiatives.\n"
