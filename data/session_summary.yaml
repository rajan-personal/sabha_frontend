- name: "Reimagining Gender in Technology - Designing Safer Digital Futures and Advancing Ethical AI for Inclusive Platforms"
  description: "India is rapidly adopting AI and digital technologies across governance, education, health, commerce, and social life. While these systems offer inclusion and innovation, they also pose growing risks for women, girls, and gender-diverse persons, including cyberstalking, deepfakes, harassment, and algorithmic bias, limiting safe digital participation. As India's digital population expands, embedding gender-responsive, rights-based, and ethical approaches in digital governance and AI design is urgent."
