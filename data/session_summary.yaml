- name: "From Silos to Scale – Enabling AI for All"
  description: "This session will discuss how international cooperation can enable replication, adoption, and scale up of AI for economic growth and social good solutions. It will provide an opportunity for delegates to discuss pathways for enabling the global community to move beyond isolated pilots and efforts to scale impact creation, translating innovation breakthroughs into measurable, population scale outcomes. This session will also mark the official launch of the Global AI Impact Commons, supported by Gates Foundation. "
