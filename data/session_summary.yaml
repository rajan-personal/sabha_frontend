  description: "There is growing recognition that Global South contexts require governance models that go beyond static regulation. These models must retain regulatory rigor while enabling dynamic assessment, contextual evidence generation, and socio-technical considerations that reflect local priorities, capacities, and values.\nCore Proposition: A Two-Track Adaptive Governance Model\nThis panel proposes a pragmatic, two-track governance approach for AI in health"
