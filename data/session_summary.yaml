- name: "From AI User to Creator: The Next Leap of India's AI Innovation"
  description: "India has emerged as one of the world's largest adopters of AI, driven by scale of data, digital public infrastructure, and enterprise digitisation. However, the next strategic leap lies in transitioning from being predominantly an AI user to becoming a creator of indigenous AI systems. \nThis session will examine what it takes for India to move decisively up the AI value chain: from deploying models to building home-grown AI solutions."
