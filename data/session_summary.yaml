  tags:
    - Governance
- name: "What if Fairness started at the Dataset Level? Need for a Fair Human-Centric Image Dataset for Ethical AI Benchmarking"
  description: "The session explains why fairness must start at the dataset level and offers practical guidance for researchers, startups, and policymakers in India to adopt fairness-first AI evaluation practices. It would also delve into why a consent-driven, globally diverse, ethically sourced dataset for fairness and bias evaluation in human-centric computer vision is a necessity. "
  speakers:
    - "Sruti Nagpal, Sony AI"
  tags:
    - Governance
- name: "Where AI Innovation meets Impact in Cancer Care—CATCH Grant Awards 2026"
  description: "The IndiaAI–NCG CATCH Grant Ceremony at the IndiaAI Impact Summit recognises AI innovations in cancer care, highlighting solutions that are clinically relevant, evidence-driven, and deployment-ready. Alongside the awards, a multi-stakeholder dialogue will explore how AI can move from pilot initiatives to scalable and trusted healthcare systems. Bringing together stakeholders from government, clinical practice, industry, and international partners, the session will discuss pathways for responsible and impact-focused AI deployment in oncology."
  speakers:
    - "Dr Harit Chaturvedi, Max Hospitals, NCG Core Committee Member"
    - "Dr.  Alain Labrique, WHO"
    - "Dr. Anunaya Jain, Jhpiego"
    - "Shri. Abhishek Singh, Meity, GoI"
  tags:
    - Healthcare
- name: "Powering the Public Good: Aligning Industry, Philanthropy, and Government from India to Africa"
  description: "Two powerhouses of technology and philanthropy will share their unique perspectives on how collaboration across the public and private sectors can advance national AI priorities, spur innovation, and deliver public value.\nThe conversation will continue with African government leaders in AI discussing pathways for global cooperation, pooled resources, and inclusive impact.\nBringing together leaders from industry, philanthropy, and government, the session aims to translate national AI visions into coordinated, real-world outcomes."
  speakers:
    - "Cina Lawson, Public Sector Efficiency & Digital Transformation, Togo"
    - "Diana Sang, Digital Impact Alliance"
    - "Lacina Kone, Smart Africa"
    - "Nandan Nilekani, Infosys Technologies"
