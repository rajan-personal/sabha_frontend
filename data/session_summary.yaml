- name: "Toward Collective Action: A Roundtable on Safe and Trusted AI"
  description: "This roundtable brings together African policymakers, researchers, civil society, and innovation leaders to discuss safe and trusted AI governance. The focus will be on implementing commitments, enhancing coordination, and addressing underexplored risks, such as cyber, bio, and loss-of-control threats. The session will include opening reflections, a moderated panel, and an interactive Q&A to share insights and identify collaboration pathways, contributing to the India AI Impact Summit outcomes."
  speakers:
    - "Chinasa T. Okolo, TechneCultura . United Nations office for digital and emerging technologies"
