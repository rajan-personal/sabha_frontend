  description: "Artificial Intelligence (AI) promises better healthcare worldwide, but biased datasets and designs risk reinforcing inequities and harming already marginalised communities (e.g. elderly, disabled, rural). An inter-disciplinary panel discussion will explore inclusive AI strategies (e.g. participatory design) that ensure AI is designed, developed, and deployed in a way that mitigates unintended harm and helps bridge health inequities."
