- name: "AI for ALL Challenge Overview and Panel discussion on 'Leveraging AI to drive Development Objectives in the Global South"
  description: "The AI for ALL: Global Impact Challenge showcase will start with the journey of the Challenge, from its launch in October to the selection of 20 standout finalists from a highly competitive global pool. The session will also feature a dynamic, jury-led panel exploring how AI can unlock transformative development across the Global South. Senior voices from industry, venture capital, and the development sector will share real-world applications of AI, while diving into critical themes such as equitable access, responsible governance, and inclusive deployment at scale."
