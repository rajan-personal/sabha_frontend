  description: "Mission Karmayogi is advancing the vision of a citizen-centric and future-ready civil service through a democratized, competency-led approach to capacity building.  The event will explore how India is leveraging  artificial intelligence to further strengthen public sector capacity building, highlighting emerging best practices and innovative use cases. It will also deliberate on the creation of a scalable, AI-enabled Digital Public Good, not only for India, but for the world."
