- name: "From Principles to Proof: Operationalizing Responsible AI for Global Impact"
  description: "Responsible AI, particularly for the Global South, is both moral mandate and strategic lever. This session explores how safety-by-design catalyzes scale, addressing linguistic and cultural nuance. The discussion bridges technical guardrails like hardware-level privacy and confidential computing with societal needs for safe AI experiences. Panelists examine how inclusive systems empower the last mile and mitigate harm, operationalizing the People and Progress Sutras through the Safe and Trusted AI Chakra for equitable adoption.\n\n"
  speakers:
    - "Anand Kashyap, Fortanix"
