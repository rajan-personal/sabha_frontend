- name: "Democratizing Predictive AI: From Big Enterprises to MSMEs and Public Systems"
  description: "This panel will examine how predictive AI can be made accessible beyond large enterprises\nto MSMEs, startups, and public systems in India. It will analyze why predictive intelligence\nremains concentrated, the implications for competitiveness and inclusive growth, and how Time Series Foundation Models can lower adoption barriers. The discussion will surface\nreal deployment constraints: data quality, skills, cost, and infrastructure, and outline\npractical pathways, ecosystem requirements, and the strategic importance of sovereign\npredictive AI capabilities"
  speakers:
    - "Goda Ramkumar, Swiggy"
    - "Mr. Piyush Prakashchandra Somani, ESDS Software Solution Ltd."
  tags:
    - Startups
- name: "Digital Public Goods for Global AI Equity"
  description: "This session examines the role of Digital Public Goods (DPGs) in advancing global AI equity, aligned with the AI Impact Summit 2026 focus on inclusive and responsible AI. As AI accelerates, access to AI resources and capabilities is becoming an important public-policy consideration. The discussion explores how open data and open-source tools enable context-sensitive AI ecosystems, drawing on relevant initiatives to identify pathways for expanding access to AI."
