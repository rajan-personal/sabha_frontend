- name: "Harnessing the Transformative Potential of AI to Empower All"
  description: "This session discusses how countries can harness AI to advance social empowerment for all, uplifting all sections of society and ensuring that the benefits of technological progress are shared equitably by all\n"
  speakers:
    - "Shri. Rajesh Aggarwal, Chair "
    - "Switzerland, Co-Chair "
