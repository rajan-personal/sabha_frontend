- name: "AI for India's Next Billion: Intergenerational Insights for Inclusive and Future-Ready Growth"
  description: "AI is rapidly reshaping economies, public services, and governance. As the global population \napproaches 10 billion people by the next century, the stakes are uniquely high for the countries \nacross Asia and Africa that will host many of the world's next billion people. Choices made today will \nshape the lives of those young people, and determine whether AI becomes a force for shared \nprosperity and public trust, or deepens inequality and power imbalances for generations."
