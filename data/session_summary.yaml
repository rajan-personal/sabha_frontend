- name: "Inaugural Session & Launch of WG Deliverables "
  description: "This session discusses the overarching vision, priorities, and agenda of the India AI Impact Summit. It also gives an overview of the various deliverables across working groups."
  speakers:
    - "Abhishek Singh, Additional Secretary, Ministry of Electronics and Information Technology, Government of India"
    - "S. Krishnan, Secretary, Ministry of Electronics and Information Technology, Government of India"
    - "Sh. Ashwini Vaishnaw, Minister of Railways; Minister of Information and Broadcasting; MeitY, Government of India"
  tags:
    - Governance
- name: "Building Sovereign AI Infrastructure: Empowering Citizens, Transforming Nations"
  description: "India is entering a phase where AI capability becomes strategic infrastructure—akin to power, telecom, and cloud. Nations pursue Sovereign AI: domestic capacity to build and operate infrastructure, train and align models, and deploy AI safely at scale for public services industries.\n\nThis executive session features four NVIDIA leaders covering the AI lifecycle:\nBuild AI Factory (blueprint) - Marc Hamilton, SVP Solution Architecture\nUse AI Factory (software/data/training/inference) - John Fanelli, VP GenAI Ecosystem\nSovereign AI (strategy/impact/patterns) - Calista Redmond, VP Global AI Initiatives\nIndustry transformation (sector use-cases) - Shanker Trivedi, SVP Enterprise Business\n\nOutcomes (2 hrs): AI Factory architecture; end-to-end blueprint (data→pretrain→post-train→serve); Sovereign AI framing (why now, global examples, value metrics); high-ROI GenAI in finance/healthcare/energy/telecom/government."
  speakers:
    - "Calista Redmond, Nvidia"
    - "Jigar Halani (moderator), Nvidia"
    - "John Fanelli, Nvidia"
    - "Marc Hamilton, Nvidia"
    - "Shanker Trivedi, Nvidia"
  tags:
    - Hardware
- name: "Building Safe and Trusted AI Infrastructure for Population-Scale AI\n"
  description: "This session examines infrastructure for building trusted AI systems at population scale. As nations deploy AI in sensitive domains like healthcare and finance, the discussion explores how secure architectures protect privacy while enabling innovation. Panelists discuss zero-trust frameworks, specialized workforce development, and energy-efficient secure computing. This operationalizes the People and Progress Sutras through the Safe and Trusted AI Chakra, ensuring AI adoption remains inclusive, secure, and equitably shared."
  speakers:
    - "Assaf Azrilevich, Nvidia"
    - "Benedict Macon Cooney, Tony Blair Institute for Global Change"
    - "Raj Reddy, Carnegie Mellon University"
    - "Tapan Sahoo, Maruti Suzuki"
    - "Utkarsh Saxena/Co-founder (Moderator), AdalatAI"
  tags:
    - Hardware
- name: "AI and Robotics: The Engine of India's New Industrial Age"
  description: "This session examines how robotics and Physical AI accelerate automation and strengthen Make in India. Panelists discuss how researchers, startups, and SMEs leverage platforms like NVIDIA's Isaac and Omniverse to build resource-optimized manufacturing ecosystems. The discussion demonstrates how indigenous innovation and workforce skilling create high-value employment while ensuring industrial growth is environmentally sustainable and economically inclusive, operationalizing the Planet and Progress Sutras through the Resilience, Innovation, and Efficiency Chakra."
  speakers:
    - "Amit Goel, Nvidia"
    - "Raghu Dharmaraju, ARTPARK"
    - "Shashank Reddy, Evam Law & Policy"
  tags:
    - Manufacturing
    - Startups
- name: "Strengthening Data and AI Collaboratives for Economic Growth and Social Good"
  description: "Complex public challenges demand trusted, actionable data for better governance. As AI reshapes public systems, accessible, interoperable, and well-governed datasets are essential for transparent, inclusive development. This panel brings together global stakeholders to advance Data and AI Collaboratives—unlocking siloed data, enabling secure sharing, and decentralised governance—to build inclusive innovation ecosystems and scale ethical AI solutions that drive evidence-based decisions, economic growth, and social good."
