    - "Sylvain Macquin, Fondation France-Asie"
  tags:
    - Governance
- name: "Safe and Trusted Agentic AI: Building Accountability and Inclusion for India and the Global South"
  description: "This expert panel session will explore the frontier of Agentic AI—autonomous systems capable of goal-directed behavior with limited human oversight—and its implications for safety, governance, and inclusivity across India and the Global South. Primarily, the session will examine frameworks for ensuring localized safety norms, ethical design, and accountability tailored to the cultural, linguistic, and infrastructural realities of the Global South."
  speakers:
    - "Dr. Abdulrahman Habib, International Center for AI Research and Ethics (ICAIRE) - under auspices of UNESCO"
    - "Gabriela Ramos, UNESCO"
  tags:
    - Governance
- name: "Unlocking India's Demographic Dividend: Blue Dots^AI as Digital Rails"
  description: "This session examines how India can unlock its demographic dividend by aligning education, skilling, and workforce systems with the demands of an AI-driven economy. Drawing from public digital infrastructure, employer-linked skilling models, and ecosystem partnerships, the discussion focuses on scalable pathways to prepare India's workforce for future jobs while ensuring inclusion and access at population scale."
  speakers:
    - "Shri Gaurav Gupta, EkStep Foundation"
    - "Shri. Abhinav Gopal, Government of Uttar Pradesh"
    - "Shri. Virender Singh, Government of Maharashtra"
    - "Smt. Manmeet Kaur Nanda, Department of Empowerment of Persons with Disabilities"
  tags:
    - Education
- name: "Responsible Quantum and AI Security Frontiers"
  description: "This panel will examine how emerging responsible quantum frameworks can guide the secure, ethical, and trustworthy development of quantum technologies, drawing lessons from the evolution of responsible AI governance. The discussion will focus on translating high-level principles—such as safety, accountability, transparency, and risk awareness—into practical measures that can be adopted by governments, industry, and research institutions.\nIt will also explore post-quantum cryptography readiness, security implications, and the shared responsibilities in preparing for quantum-era risks."
  speakers:
    - "Mr. Oliver B, Government of UK"
    - "Mr. Sachin Kakkar, Safety and Security"
    - "Mr. Vinayak Godse, Data Security Council of India"
    - "Prof. Manish Gangwar, ISB Institute of Data Science"
  tags:
    - Governance
- name: "Advancing Multilingual AI: Global South Governance of Non-English Model Development and Deployment"
  description: "Global initiatives are bridging the linguistic divide in AI by developing multilingual resources. Key efforts include India's AI for Bharat, which builds corpora for 22 official languages, and partnerships to digitize library archives in underrepresented languages. Similarly, collaborative consortiums empower researchers in Africa and other regions to advance NLP for local languages. These technical and strategic collaborations, especially across the Global South, ensure AI systems are inclusive and accessible worldwide."
  speakers:
    - "Aditya Vashistha, Cornell University and Director of Cornell Global AI Initiative"
    - "Aliya Bhatia, Center for Democracy & Technology"
    - "Chenai Chair, Masakhane African Languages Hub"
    - "Dhanaraj Thakur, Emerging Technology Initiative, Multiracial Democracy Project"
  tags:
    - Governance
- name: "AI for All: Role of Open Source Hardware and Software"
  description: "The session will demonstrate how open-source hardware and software are democratising AI by making advanced technologies intuitive, affordable, and accessible to learners, educators, and industry professionals. Through strategic partnerships, such open source knowledge is enabling innovation at scale and empowering diverse communities to build real-world AI solutions."
  speakers:
    - "Julian Caro Linares, Qualcomm"
    - "Nitish Kumar, Judge Group"
    - "Prashant Yadav, Judge Group"
  tags:
    - Hardware
- name: "Shaping Secure, Ethical and Accountable AI Systems for a Shared\nFuture"
  description: "The Global Dialogue on Safe & Trusted AI brings together senior policymakers, technology leaders, and industry experts to examine frameworks for building secure, ethical, transparent, and accountable AI systems. The session will explore governance models, risk mitigation, and public–private collaboration to\nensure responsible AI adoption across critical sectors, while balancing innovation, trust, and global interoperability in an increasingly AI-driven world."
  speakers:
    - "Mr. Abinav Varma Kalidindi, Ikonz Studios Private Limited"
    - "Mr. Ajit Kumar, HCL Tech"
    - "Mr. Alkesh K Sharma, IAS (Retd, Former Secretary, MEITY, GoI"
    - "Mr. C.P Gurnani, Tech Mahindra"
    - "Ms. Charu Srinivasan, Microsoft India Development Centre"
  tags:
    - Governance
- name: "Implementing AI Standards for Global Prosperity in an Era of Agentic AI"
  description: "Agentic AI is rapidly transforming industries and societies worldwide. Developing and adopting robust standards to manage these systems is essential for safe and trustworthy AI. Standards offer a shared foundation for implementation, benchmarking, and comparability; helping organizations and governments align responsible practices. This session brings together leading voices in AI governance and standardization from diverse regions and sectors. Panelists will explore how technical and professional standards are designed and deployed to guide responsible AI use"
  speakers:
    - "Ashley Casovan, International Associations of Privay Professionals"
    - "Dr Rachel Adams, International Association  of privacy Professionals"
    - "Emmanuel Kahembwe, International Association of Privacy Professionals"
    - "John Dickerson, International Association of privacy professionals"
  tags:
    - Governance
- name: "Safe AI: Building Shared Trust and Accountability Infrastructure"
  description: "As AI systems are deployed at population scale, ensuring trust, safety, and accountability becomes critical. This session focuses on how AI safety principles can be translated into operational governance frameworks, institutional mechanisms, and shared infrastructure that enable responsible AI adoption while protecting users and communities."
  speakers:
    - "Dr Akash Kapur, Princeton University"
    - "Dr Ponnurangam Kumaraguru, IIIT-Hyderabad"
    - "Ms Deepika Mogilishetty, EkStep Foundation"
    - "Ms Urvashi Aneja, Digital Futures Lab"
  tags:
    - Governance
- name: "Demystifying Voice Stack - What Makes Voice AI Work at Scale"
  description: "This session brings together practitioners building and operating Voice AI systems in real-world settings. The session follows an Ignite-style format with short, structured talks to enable clarity and comparison across layers of the stack. The focus is on what is working today, where constraints exist, and which decisions will matter over the next 12–18 months. The session concludes with a discussion that connects insights across the Voice AI stack for builders, adopters, and policymakers."
  speakers:
    - "Ananth Nagaraj, Gnani.ai"
    - "Debdoot Mukherjee, Meesho"
    - "Maitreya Wagh, Bolna"
    - "Ramesh MC, Coss"
    - "Sunil Gupta, Yotta"
  tags:
    - Hardware
- name: "Resilience and Customer Protection in the Age of AI"
  description: "AI is reshaping financial inclusion and increasing the scale, sophistication, risk, and diversity of fraud. This event convenes global and Indian experts in AI, financial services, and customer protection in a panel discussion to explore:\n\n1. How AI has transformed financial inclusion and can yield immense benefits, but also amplifies fraud risks, consumer vulnerability, and gaps in real-time protection?\n\n2. Where current interventions fall short?\n\n3. Why behavioural approaches are essential for fraud resilience?"
  speakers:
    - "Nirat Bhatnagar, The Atlas of Behavior Change in Development and Belongg"
    - "Pawan Bakhshi, Inclusive Financial Services, Gates Foundation"
    - "Rahul Vatts, Bharti Airtel"
    - "Shamina Singh, Mastercard Center for Inclusive Growth"
  tags:
    - Finance
- name: "Transforming Academia Through AI: Building Future‑Ready Learners and Institutions"
  description: "Panel session on role of AI in academia. Panelists were suggested as Mr Deepak Bagla, Ms Aarti Rai, MSR, and Dr Preet Deep Singh as I remember"
