- name: "Leveraging AI4All: Pathways to Inclusion"
  description: "This session brings together leaders from government, industry, the judiciary, and international institutions to showcase how India is deploying AI for population-scale, citizen-centric impact. The session examines real-world inclusion successes across accessibility, language, and service delivery, and explores how India's experience can inform global collaboration, capacity building, and inclusive AI adoption across the world."
  speakers:
    - "Agustya Mehta, Meta"
    - "Archana Joshi, Xoriant"
    - "Hoda Baraka, The Egyptian Minister of ICT for Technology Talents Development, Egypt"
    - "Rutuja Pol, Ikigai Law"
  tags:
    - Governance
- name: "Democratisation of AI – Bharat Story"
  description: "This session explores embedding AI into India's Digital Public Infrastructure (DPI) to make technology truly inclusive. Leveraging the foundation of the Bharat Stack, including Aadhaar, UPI, Bhashini, and ONDC, the panel discusses how state governments are scaling AI for citizen centric governance, widening access to shared infrastructure, improving benefits delivery, and enabling startups and MSMEs to adopt plug and play AI tools for population scale impact."
  speakers:
    - "Dr. Manjula N, IAS, EITBT, Government of Karnataka"
    - "Mr. Bhaskar Katamneni, IAS, ITE&C, Government of Andhra Pradesh"
    - "Mr. Sanjay Dubey, IAS, Department of Science and Technology (DST), Government of Madhya Pradesh"
    - "Mr. Sanjeev Kumar Gupta, Karnataka Digital Economy Mission (KDEM)"
    - "Mr. Vishal Kumar Dev, IAS, E&IT, Government of Odisha"
  tags:
    - Governance
- name: "Capacity Building in Digital Health"
  description: "Artificial Intelligence has rapidly achieved technical maturity across its first two developmental levels, yet organizational maturity has not kept pace. This panel examines the critical gap between AI capability and institutional readiness. It will explore how targeted capacity building, across leadership, workforce, governance, and processes, can unlock AI's full value. The discussion focuses on activating impact from the bottom of the value chain, ensuring AI adoption translates into measurable outcomes rather than isolated technological success."
  speakers:
    - "Col. (Dr.) Sarvjeet Kaur, Indian Nursing Council"
    - "Dr. Suresh Yadav, The Commonwealth"
    - "Mr. Aneesh Chopra, Government of the United States, under President Barack Obama"
